name: "Peercoin Core"
version: "0.15.11"
slug: "peercoin"
description: "Peercoin Core ARM64 avec minting"
url: "https://github.com/spartiate74/peercoin-haos-addon"
startup: services
boot: auto
init: false

arch:
  - aarch64

options:
  rpcuser: "ppc_rpc"
  rpcpassword: ""
  walletname: "peercoin-mint"
  walletpassphrase: ""
  minting: false

schema:
  rpcuser: str
  rpcpassword: password
  walletname: str
  walletpassphrase: password
  minting: bool

ports:
  9901/tcp: 9901

ports_description:
  9901/tcp: "Port réseau Peercoin"

image: "ghcr.io/spartiate74/{arch}-peercoin"
