name: Peercoin Core
version: "0.15.14"
slug: "peercoin"
description: "Peercoin Core ARM64 avec minting continu"
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
init: false

ports:
  9901/tcp: 9901
  9902/tcp: 9902

options:
  rpcuser: ppc_rpc
  rpcpassword: ""
  walletname: android-legacy
  walletpassphrase: ""
  minting: false

schema:
  rpcuser: str
  rpcpassword: password
  walletname: str
  walletpassphrase: password
  minting: bool
