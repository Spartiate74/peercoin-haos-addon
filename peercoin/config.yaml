name: "Peercoin Core"
version: "0.15.13"
slug: "peercoin"
description: "Peercoin Core ARM64 avec minting continu"
arch:
  - aarch64

map:
  - type: share
    read_only: false

startup: services
boot: auto
init: false

ports:
  9901/tcp: 9901
  9902/tcp: 9902

ports_description:
  9901/tcp: "Peercoin réseau principal"

options:
  rpcuser: "ppc_rpc"
  rpcpassword: ""
  minting: false

schema:
  rpcuser: str
  rpcpassword: password
  minting: bool
